<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por tu preinscripción! | IESTP Paiján</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a3d62 0%, #062c48 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gracias-container {
            background: white;
            border-radius: 2rem;
            padding: 3rem;
            max-width: 600px;
            margin: 2rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .icono {
            width: 100px;
            height: 100px;
            background: #16a085;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .icono i {
            font-size: 3rem;
            color: white;
        }
        h1 {
            color: #0a3d62;
            margin-bottom: 1rem;
        }
        p {
            color: #6c757d;
            margin-bottom: 1rem;
            line-height: 1.6;
        }
        .btn-volver {
            display: inline-block;
            background: #e67e22;
            color: white;
            padding: 1rem 2rem;
            border-radius: 3rem;
            text-decoration: none;
            font-weight: 600;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }
        .btn-volver:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="gracias-container">
        <div class="icono">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1>¡Gracias por tu preinscripción!</h1>
        <p>Hemos recibido tus datos correctamente.</p>
        <p>Un asesor se comunicará contigo en las próximas 24 horas para guiarte en el proceso de admisión.</p>
        <p><strong>📞 ¿Tienes dudas?</strong> Escríbenos al WhatsApp: <strong>919 490 297</strong></p>
        <a href="admision.html" class="btn-volver">
            <i class="fas fa-arrow-left"></i> Volver a Admisión
        </a>
    </div>
</body>
</html>
